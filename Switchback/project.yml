name: Switchback
options:
  bundleIdPrefix: com.cadewardc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Switchback:
    type: application
    platform: iOS
    sources:
      - path: Switchback
      - path: Shared
    dependencies:
      - target: SwitchbackWidgets
      - package: MapLibre
    info:
      path: Switchback/Info.plist
      properties:
        CFBundleDisplayName: Switchback
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocationWhenInUseUsageDescription: Switchback shows where you are on the map, finds trails near you and records your hikes.
        NSLocationAlwaysAndWhenInUseUsageDescription: Switchback keeps recording your hike while the phone is locked.
        NSPhotoLibraryUsageDescription: Switchback shows the photos you took during a hike on its map. They stay on your phone.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - location
          - audio
        CFBundleDocumentTypes:
          # lets Files, Mail and other apps open .gpx tracks in Switchback
          - CFBundleTypeName: GPX track
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografix.gpx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadewardc.switchback
        PRODUCT_NAME: Switchback
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
    scheme: {}

  SwitchbackWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Switchback
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadewardc.switchback.widgets
        PRODUCT_NAME: SwitchbackWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
