name: Build trail packs (Switchback)

# Turns OpenStreetMap's US state extracts (Geofabrik) into Switchback's trail packs: one compact file per state
# (<state>.trails) plus a small summary (<state>.json), all in the single release "trails-us", with the list of
# states (regions.json). Weekly, by hand, or when the builder changes.

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "Switchback/scripts/build_trail_pack.py"
      - ".github/workflows/trail-packs.yml"

permissions:
  contents: write

concurrency:
  group: trail-packs
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: [alabama, alaska, arizona, arkansas, california, colorado, connecticut, delaware,
                 district-of-columbia, florida, georgia, hawaii, idaho, illinois, indiana, iowa, kansas, kentucky,
                 louisiana, maine, maryland, massachusetts, michigan, minnesota, mississippi, missouri, montana,
                 nebraska, nevada, new-hampshire, new-jersey, new-mexico, new-york, north-carolina, north-dakota,
                 ohio, oklahoma, oregon, pennsylvania, puerto-rico, rhode-island, south-carolina, south-dakota,
                 tennessee, texas, utah, vermont, virginia, washington, west-virginia, wisconsin, wyoming]
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium and shapely
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium shapely

      - name: Download the ${{ matrix.region }} extract
        run: |
          curl -fsSL --retry 5 --retry-delay 15 -o region.osm.pbf \
            "https://download.geofabrik.de/north-america/us/${{ matrix.region }}-latest.osm.pbf"
          ls -lh region.osm.pbf

      - name: Keep only trails, routes and parks
        run: |
          osmium tags-filter region.osm.pbf \
            r/route=hiking,foot,walking w/highway=path,footway,bridleway,track \
            nwr/boundary=protected_area,national_park nwr/leisure=park,nature_reserve \
            -o trails.osm.pbf --overwrite
          ls -lh trails.osm.pbf

      - name: Build the packs
        run: |
          PACK_VERSION=$(date -u +%Y%m%d) python3 Switchback/scripts/build_trail_pack.py trails.osm.pbf "${{ matrix.region }}" out
          du -sh out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view trails-us > /dev/null 2>&1 || gh release create trails-us --target "${{ github.sha }}" \
            --title "Switchback trail packs (US)" --latest=false \
            --notes "Trails for Switchback built from OpenStreetMap (© OpenStreetMap contributors, ODbL) via Geofabrik: one file per state plus regions.json. Rebuilt weekly." || true
          for i in 1 2 3 4; do gh release upload trails-us out/* --clobber && break; sleep $((i * 15)); done

  index:
    needs: pack
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build the list of states (regions.json)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p idx
          gh release download trails-us -R "$REPO" -p "*.json" -D idx --clobber
          rm -f idx/regions.json
          python3 - <<'PY'
          import json, glob
          regions, total, trails = {}, 0, 0
          for f in sorted(glob.glob("idx/*.json")):
              i = json.load(open(f))
              if not i.get("bbox"):
                  continue
              regions[i["region"]] = i
              total += i["bytes"]; trails += i.get("trails", 0)
          json.dump({"regions": regions}, open("regions.json", "w"), separators=(",", ":"))
          print(f"{len(regions)} regions, {trails} trails, {total / 1024 / 1024:.1f} MB in all")
          for name, r in sorted(regions.items(), key=lambda kv: -kv[1]["bytes"]):
              print(f"  {name:<22} {r['bytes'] / 1024:8.0f} KB  {r.get('trails', 0):7d} trails")
          PY
      - name: Publish regions.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload trails-us regions.json -R "$REPO" --clobber
