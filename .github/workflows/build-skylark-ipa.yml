name: Build unsigned IPA (Skylark)

# The flight simulator in Skylark/. Edge, Shuō and Pip have their own workflows.

on:
  push:
    branches: ["**"]
    paths:
      - "Skylark/**"
      - ".github/workflows/build-skylark-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skylark-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure the iOS platform is installed
        run: |
          xcodebuild -version
          xcodebuild -downloadPlatform iOS || true

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd Skylark && xcodegen generate

      - name: Build the app (no code signing)
        run: |
          mkdir -p build
          xcodebuild \
            -project Skylark/Skylark.xcodeproj \
            -scheme Skylark \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || { grep -E "error:|Undefined symbol|ld: " build/xcodebuild.log | sort -u | head -60; tail -20 build/xcodebuild.log; exit 1; }
          grep -E "warning: .*/Skylark/Skylark/" build/xcodebuild.log | sort -u || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Package Skylark-unsigned.ipa
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/Skylark.app
          test -f "$APP/Skylark"
          test -f "$APP/sky-hopper.json" && test -f "$APP/whirlybird.json" && test -f "$APP/How to make aircraft.txt"
          test -f "$APP/Assets.car" && plutil -extract CFBundleIcons xml1 -o - "$APP/Info.plist" > /dev/null
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Skylark-unsigned.ipa Payload)
          ls -lh build/Skylark-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skylark-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skylark-unsigned-ipa
          path: build/Skylark-unsigned.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="skylark-build-${{ github.run_number }}"
          gh release create "$TAG" build/Skylark-unsigned.ipa \
            --target "${{ github.sha }}" \
            --title "Skylark (unsigned) #${{ github.run_number }}" \
            --notes "Unsigned Skylark IPA (flight simulator) built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Sign it with your sideloading tool (AltStore, SideStore, Sideloadly, TrollStore) before installing." \
            --latest=false
