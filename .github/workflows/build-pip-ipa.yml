name: Build unsigned IPA (Pip)

# The floating photos app in Pip/. Edge and Shuō have their own workflows.

on:
  push:
    branches: ["**"]
    paths:
      - "Pip/**"
      - ".github/workflows/build-pip-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pip-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure the iOS platform is installed
        run: |
          xcodebuild -version
          xcodebuild -downloadPlatform iOS || true

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd Pip && xcodegen generate

      - name: Build the app (no code signing)
        run: |
          mkdir -p build
          xcodebuild \
            -project Pip/Pip.xcodeproj \
            -scheme Pip \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || { grep -E "error:|Undefined symbol|ld: " build/xcodebuild.log | sort -u | head -60; tail -20 build/xcodebuild.log; exit 1; }
          grep -E "warning: .*/Pip/Pip/" build/xcodebuild.log | sort -u || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Package Pip-unsigned.ipa
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/Pip.app
          test -f "$APP/Pip"
          plutil -extract UIBackgroundModes xml1 -o - "$APP/Info.plist" | grep -q audio
          test -f "$APP/Assets.car" && plutil -extract CFBundleIcons xml1 -o - "$APP/Info.plist" > /dev/null
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Pip-unsigned.ipa Payload)
          ls -lh build/Pip-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pip-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pip-unsigned-ipa
          path: build/Pip-unsigned.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pip-build-${{ github.run_number }}"
          gh release create "$TAG" build/Pip-unsigned.ipa \
            --target "${{ github.sha }}" \
            --title "Pip (unsigned) #${{ github.run_number }}" \
            --notes "Unsigned Pip IPA (photos in Picture in Picture) built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Sign it with your sideloading tool (AltStore, SideStore, Sideloadly, TrollStore) before installing." \
            --latest=false
