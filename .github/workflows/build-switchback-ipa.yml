name: Build unsigned IPA (Switchback)

# The hiking/trail app in Switchback/. Edge and Shuō have their own workflows.

on:
  push:
    branches: ["**"]
    paths:
      - "Switchback/**"
      - ".github/workflows/build-switchback-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switchback-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure the iOS platform is installed
        run: |
          xcodebuild -version
          xcodebuild -downloadPlatform iOS || true

      - name: Build in trail packs (fast first launch, works offline from the start)
        env:
          # areas whose trail files ship inside the app: "none" (the app downloads your area first, then the rest of
          # your country on Wi-Fi), "all" (every US state, about 38 MB), or a list like "missouri kansas"
          BUNDLED_STATES: "none"
        run: |
          mkdir -p Switchback/Switchback/Resources/Packs
          base=https://github.com/${{ github.repository }}/releases/download/trails-us
          curl -fsSL --retry 4 -o Switchback/Switchback/Resources/Packs/regions.json "$base/regions.json" || echo "no regions.json yet"
          states="$BUNDLED_STATES"
          if [ "$states" = "all" ] && [ -f Switchback/Switchback/Resources/Packs/regions.json ]; then
            # every US state (other countries download when the map first shows them)
            states=$(python3 -c "import json; r=json.load(open('Switchback/Switchback/Resources/Packs/regions.json'))['regions']; print(' '.join(k for k, v in r.items() if v.get('country', 'US') == 'US'))")
          fi
          [ "$states" = "none" ] && states=""
          for s in $states; do
            curl -fsSL --retry 4 -o "Switchback/Switchback/Resources/Packs/$s.trails" "$base/$s.trails" || echo "no pack for $s yet"
          done
          ls Switchback/Switchback/Resources/Packs | wc -l
          du -sh Switchback/Switchback/Resources/Packs

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd Switchback && xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/spm
          key: switchback-spm-${{ hashFiles('Switchback/project.yml') }}

      - name: Resolve Swift packages (with retries)
        run: |
          for i in 1 2 3 4 5; do
            xcodebuild -resolvePackageDependencies -project Switchback/Switchback.xcodeproj -scheme Switchback \
              -clonedSourcePackagesDirPath build/spm && exit 0
            echo "Package download failed (attempt $i), retrying…"; sleep $((i * 20))
          done
          exit 1

      - name: Build the app (no code signing)
        run: |
          mkdir -p build
          xcodebuild \
            -project Switchback/Switchback.xcodeproj \
            -scheme Switchback \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || { grep -E "error:|Undefined symbol|ld: " build/xcodebuild.log | sort -u | head -60; tail -20 build/xcodebuild.log; exit 1; }
          grep -E "warning: .*/Switchback/Switchback/" build/xcodebuild.log | sort -u || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Package Switchback-unsigned.ipa
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/Switchback.app
          test -f "$APP/Switchback"
          test -d "$APP/PlugIns/SwitchbackWidgets.appex"
          test -f "$APP/switchback-style.json" && test -f "$APP/switchback-style-dark.json"
          test -f "$APP/Assets.car" && plutil -extract CFBundleIcons xml1 -o - "$APP/Info.plist" > /dev/null
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Switchback-unsigned.ipa Payload)
          ls -lh build/Switchback-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: switchback-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Switchback-unsigned-ipa
          path: build/Switchback-unsigned.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="switchback-build-${{ github.run_number }}"
          gh release create "$TAG" build/Switchback-unsigned.ipa \
            --target "${{ github.sha }}" \
            --title "Switchback (unsigned) #${{ github.run_number }}" \
            --notes "Unsigned Switchback IPA (trails and hike recording) built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Sign it with your sideloading tool (AltStore, SideStore, Sideloadly, TrollStore) before installing." \
            --latest=false
