name: Build unsigned IPA (Shuō)

# The Mandarin speaking app in Shuo/. Edge has its own workflow (build-ipa.yml).

on:
  push:
    branches: ["**"]
    paths:
      - "Shuo/**"
      - "scripts/fetch-sherpa-ios.sh"
      - ".github/workflows/build-shuo-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shuo-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure the iOS platform is installed
        run: |
          xcodebuild -version
          xcodebuild -downloadPlatform iOS || true

      - name: Cache sherpa-onnx
        uses: actions/cache@v4
        with:
          path: vendor
          key: sherpa-ios-${{ hashFiles('scripts/fetch-sherpa-ios.sh') }}

      - name: Fetch sherpa-onnx for iOS
        run: ./scripts/fetch-sherpa-ios.sh

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd Shuo && xcodegen generate

      - name: Build the app (no code signing)
        run: |
          mkdir -p build
          xcodebuild \
            -project Shuo/Shuo.xcodeproj \
            -scheme Shuo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || { grep -E "error:|Undefined symbol|ld: " build/xcodebuild.log | sort -u | head -60; tail -20 build/xcodebuild.log; exit 1; }
          grep -E "warning: .*/Shuo/Shuo/" build/xcodebuild.log | sort -u || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Package Shuo-unsigned.ipa
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/Shuo.app
          test -f "$APP/Shuo"
          test -f "$APP/pinyin.tsv"
          test -f "$APP/Assets.car" && plutil -extract CFBundleIcons xml1 -o - "$APP/Info.plist" > /dev/null
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Shuo-unsigned.ipa Payload)
          ls -lh build/Shuo-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shuo-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuo-unsigned-ipa
          path: build/Shuo-unsigned.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="shuo-build-${{ github.run_number }}"
          gh release create "$TAG" build/Shuo-unsigned.ipa \
            --target "${{ github.sha }}" \
            --title "Shuō (unsigned) #${{ github.run_number }}" \
            --notes "Unsigned Shuō IPA (Mandarin speaking practice) built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Sign it with your sideloading tool (AltStore, SideStore, Sideloadly, TrollStore) before installing." \
            --latest=false
