name: Publish Warcamp (GitHub Pages)

# The browser game in Warcamp/. Needs Settings > Pages > Source: "GitHub Actions" to be switched on once.

on:
  push:
    branches: ["main"]
    paths:
      - "Warcamp/**"
      - ".github/workflows/warcamp-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the deploy step looks up the uploaded site among this run's artifacts
  pages: write
  id-token: write

concurrency:
  group: warcamp-pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs: when they shared one, the deploy step looked for the
  # site a moment after it was uploaded and did not find it (actions/deploy-pages issue 451).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Play whole games headless
        run: node Warcamp/test/sim.test.mjs
      - name: Leave tests and docs out of the site
        run: rm -rf Warcamp/test Warcamp/docs Warcamp/PLAN.md Warcamp/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: Warcamp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
